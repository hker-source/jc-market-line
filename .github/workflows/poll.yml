name: hkjc-poll

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: hkjc-poll
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HKJC_ODDS_TYPES: HAD,SGA,HDC,CHL,HIL,CHD
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore odds DB (most recent working copy)
        uses: actions/cache/restore@v4
        with:
          path: data/hkjc_odds.db
          key: odds-db-none-${{ github.run_id }}
          restore-keys: odds-db-

      - name: Poll once
        timeout-minutes: 10
        run: python poll_once.py --db data/hkjc_odds.db

      - name: Save odds DB
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/hkjc_odds.db
          key: odds-db-${{ github.run_id }}-${{ github.run_attempt }}
